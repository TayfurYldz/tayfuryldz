<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="t d">
  <title id="t">Bugcrowd — tayfuryldz</title>
  <desc id="d">Animated Bugcrowd hacker profile card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#15100b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ffa657"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="318" height="318" rx="24" fill="url(#bg)" stroke="#30363d"/>
  <rect x="18" y="18" width="284" height="284" rx="18" fill="#0f0d0b" stroke="#2b2118"/>

  <rect x="28" y="28" width="52" height="52" rx="11" fill="#f97316"/>
  <text x="54" y="63" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">BC</text>
  <text x="94" y="51" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Bugcrowd</text>
  <text x="94" y="72" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="12">hacker profile</text>

  <line x1="28" y1="98" x2="292" y2="98" stroke="#2b2118"/>

  <text x="28" y="132" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">tayfuryldz</text>
  <text x="28" y="158" fill="#9da7b3" font-family="Arial, Helvetica, sans-serif" font-size="13">Security Researcher</text>
  <text x="28" y="181" fill="#9da7b3" font-family="Arial, Helvetica, sans-serif" font-size="13">Bug Bounty · Vulnerability Research</text>

  <rect x="28" y="210" width="264" height="50" rx="12" fill="#17110d" stroke="#362417"/>
  <text x="44" y="231" fill="#ffa657" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">bugcrowd.com/h/</text>
  <text x="44" y="248" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">tayfuryldz</text>

  <text x="28" y="284" fill="#ffa657" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">OPEN PROFILE  →</text>
  <circle cx="286" cy="280" r="4" fill="#f97316">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <rect x="18" y="18" width="284" height="2" rx="1" fill="#f97316" opacity="0.16"/>
  <rect x="18" y="18" width="74" height="2" rx="1" fill="url(#orange)" filter="url(#glow)">
    <animate attributeName="x" values="18;228;18" dur="3.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="300" y="34" width="2" height="68" rx="1" fill="#f97316" opacity="0.08"/>
  <rect x="300" y="34" width="2" height="18" rx="1" fill="#ffa657">
    <animate attributeName="y" values="34;82;34" dur="2.2s" repeatCount="indefinite"/>
  </rect>
</svg>
