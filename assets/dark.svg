<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Tayfur Yildiz — Security Researcher</title>
  <desc id="desc">Animated terminal-style profile banner for GitHub dark mode.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1f2a37" stroke-width="1" opacity="0.5"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#0d1117" stop-opacity="0.9"/><stop offset="1" stop-color="#0d1117" stop-opacity="0.72"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="type1"><rect x="75" y="117" width="0" height="24"><animate attributeName="width" values="0;740;740" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type2"><rect x="75" y="154" width="0" height="24"><animate attributeName="width" values="0;0;800;800" keyTimes="0;0.25;0.65;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type3"><rect x="75" y="191" width="0" height="24"><animate attributeName="width" values="0;0;0;800" keyTimes="0;0.45;0.62;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="440" rx="26" fill="#0d1117"/><rect width="1200" height="440" rx="26" fill="url(#grid)" opacity="0.72"/><rect x="28" y="28" width="1144" height="384" rx="20" fill="url(#fade)" stroke="#30363d"/>
  <circle cx="58" cy="58" r="6" fill="#ff7b72"/><circle cx="79" cy="58" r="6" fill="#f2cc60"/><circle cx="100" cy="58" r="6" fill="#56d364"/><text x="132" y="64" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">tayfur@github: ~/profile</text>
  <text x="75" y="133" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" clip-path="url(#type1)">&gt; whoami</text>
  <text x="75" y="170" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" clip-path="url(#type2)">Tayfur Yildiz // Security Researcher</text>
  <text x="75" y="207" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" clip-path="url(#type3)">bug bounty · web · api · auth · access control · tooling</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.68;1" dur="6s" repeatCount="indefinite"/><text x="75" y="270" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">signal &gt; noise</text><text x="232" y="270" fill="#30363d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">//</text><text x="266" y="270" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">proof &gt; guess</text><text x="421" y="270" fill="#30363d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">//</text><text x="455" y="270" fill="#ffa657" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">impact &gt; hype</text></g>
  <g transform="translate(820 92)"><rect x="0" y="0" width="270" height="230" rx="18" fill="#010409" stroke="#21262d"/><text x="28" y="47" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">[ ACTIVE RESEARCH ]</text><text x="28" y="87" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">HTTP       ███████░░</text><text x="28" y="117" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">AUTH       ████████░</text><text x="28" y="147" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">API        ███████░░</text><text x="28" y="177" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">AUTOMATION ████████░</text><rect x="26" y="198" width="214" height="2" fill="#238636" opacity="0.35"/><rect x="26" y="198" width="60" height="2" fill="#7ee787" filter="url(#glow)"><animate attributeName="x" values="26;180;26" dur="2.8s" repeatCount="indefinite"/></rect></g>
  <g opacity="0.82"><text x="75" y="350" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">research mode:</text><text x="194" y="350" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">evidence-first</text><rect x="316" y="336" width="10" height="18" fill="#7ee787"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/></rect></g>
  <rect x="28" y="28" width="1144" height="3" rx="2" fill="#238636" opacity="0.7"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.2s" repeatCount="indefinite"/></rect><rect x="42" y="82" width="1115" height="2" fill="#7ee787" opacity="0.09"><animate attributeName="y" values="82;390;82" dur="5.5s" repeatCount="indefinite"/></rect>
</svg>
