<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Tayfur Yildiz — Security Research Dashboard</title>
  <desc id="desc">Animated minimal dashboard banner for GitHub dark mode.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#13202c" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#09131d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="26" fill="#0d1117"/>
  <rect x="28" y="26" width="1144" height="408" rx="24" fill="url(#bg)" stroke="#22303d"/>
  <rect x="44" y="44" width="1112" height="372" rx="20" fill="url(#grid)" opacity="0.62"/>
  <rect x="56" y="56" width="1088" height="348" rx="18" fill="#050c13" stroke="#233243"/>

  <circle cx="84" cy="84" r="6" fill="#ff7b72"/>
  <circle cx="105" cy="84" r="6" fill="#f2cc60"/>
  <circle cx="126" cy="84" r="6" fill="#56d364"/>
  <text x="160" y="90" fill="#93a1af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">tayfuryldz / security-dashboard</text>

  <rect x="80" y="116" width="990" height="1" fill="#173246" opacity="0.9"/>
  <text x="92" y="154" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">&gt; init researcher --mode evidence-first --surface web/api</text>
  <rect x="616" y="140" width="9" height="18" fill="#7ee787"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/></rect>

  <text x="92" y="206" fill="#e6edf3" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="36" font-weight="600">Tayfur Yildiz</text>
  <text x="92" y="236" fill="#c6d0db" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="20">Security Researcher · Bug Bounty · Web &amp; API Security</text>
  <text x="92" y="274" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">authn/authz · access control · business logic · low-noise tooling</text>

  <text x="92" y="324" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">github    → github.com/TayfurYldz</text>
  <text x="92" y="351" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">linkedin  → linkedin.com/in/tayfur-yıldız-3b7820391</text>
  <text x="92" y="378" fill="#ffa657" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">bugcrowd  → bugcrowd.com/h/tayfuryldz</text>

  <g transform="translate(860 136)">
    <rect x="0" y="0" width="214" height="210" rx="18" fill="#02070c" stroke="#223142"/>
    <text x="22" y="34" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">[ live focus ]</text>
    <text x="22" y="72" fill="#a7b1bc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">HTTP</text>
    <rect x="84" y="60" width="78" height="13" rx="2" fill="#111b24"/>
    <rect x="84" y="60" width="61" height="13" rx="2" fill="#9aa4af"/>
    <text x="22" y="103" fill="#a7b1bc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">AUTH</text>
    <rect x="84" y="91" width="78" height="13" rx="2" fill="#111b24"/>
    <rect x="84" y="91" width="67" height="13" rx="2" fill="#9aa4af"/>
    <text x="22" y="134" fill="#a7b1bc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">API</text>
    <rect x="84" y="122" width="78" height="13" rx="2" fill="#111b24"/>
    <rect x="84" y="122" width="54" height="13" rx="2" fill="#9aa4af"/>
    <text x="22" y="165" fill="#a7b1bc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">TOOLING</text>
    <rect x="84" y="153" width="78" height="13" rx="2" fill="#111b24"/>
    <rect x="84" y="153" width="72" height="13" rx="2" fill="#9aa4af"/>
    <text x="22" y="189" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">researching / building / validating</text>
    <rect x="22" y="197" width="142" height="2" fill="#1a3a28" opacity="0.5"/>
    <rect x="22" y="197" width="48" height="2" fill="#56d364" filter="url(#glow)"><animate attributeName="x" values="22;115;22" dur="2.8s" repeatCount="indefinite"/></rect>
  </g>

  <text x="92" y="402" fill="#7d8895" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">evidence-first · reproducible · measurable impact</text>
  <rect x="56" y="56" width="1088" height="2" fill="#1f7a41" opacity="0.75"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="3.2s" repeatCount="indefinite"/></rect>
</svg>
