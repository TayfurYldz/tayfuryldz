<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Tayfur Yildiz — Security Researcher</title>
  <desc id="desc">Editorial portfolio-style hero for a security researcher.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A0B"/>
      <stop offset="0.62" stop-color="#0D0E10"/>
      <stop offset="1" stop-color="#111216"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.82" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#7EE7D8" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#A78BFA" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#090A0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" x2="1">
      <stop offset="0" stop-color="#7EE7D8"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F5C67A"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="30" fill="url(#aurora)"/>
  <rect x="1" y="1" width="1198" height="558" rx="29" fill="none" stroke="#24262B"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
    <text x="64" y="72" fill="#F4F1EA" font-size="26" font-weight="750" letter-spacing="-0.6">TY.</text>
    <text x="1136" y="70" text-anchor="end" fill="#777B83" font-size="12" font-weight="600" letter-spacing="2.2">RESEARCH   /   WORK   /   CONTACT</text>
    <text x="64" y="132" fill="#7EE7D8" font-size="12" font-weight="700" letter-spacing="2.1">TAYFUR YILDIZ · SECURITY RESEARCHER</text>
    <text x="64" y="214" fill="#F5F2EA" font-size="64" font-weight="730" letter-spacing="-2.7">Security research,</text>
    <text x="64" y="280" fill="#F5F2EA" font-size="64" font-weight="730" letter-spacing="-2.7">built on evidence.</text>
    <text x="67" y="330" fill="#A5A8AE" font-size="18" font-weight="430">Web &amp; API security, authorization, business logic and low-noise tooling</text>
    <text x="67" y="357" fill="#A5A8AE" font-size="18" font-weight="430">for authorized research and clean reproduction.</text>
    <g transform="translate(64 405)">
      <rect width="168" height="44" rx="22" fill="#F5F2EA"/>
      <text x="84" y="28" text-anchor="middle" fill="#111216" font-size="13" font-weight="700" letter-spacing="0.4">SELECTED WORK ↓</text>
      <rect x="182" width="178" height="44" rx="22" fill="#15171A" stroke="#303238"/>
      <text x="271" y="28" text-anchor="middle" fill="#D9DADD" font-size="13" font-weight="650" letter-spacing="0.4">PUBLIC PROFILES ↗</text>
    </g>
    <text x="64" y="512" fill="#666A72" font-size="12" font-weight="600" letter-spacing="1.7">SIGNAL &gt; NOISE</text>
    <text x="220" y="512" fill="#44474D" font-size="12">•</text>
    <text x="246" y="512" fill="#666A72" font-size="12" font-weight="600" letter-spacing="1.7">PROOF &gt; GUESS</text>
    <text x="413" y="512" fill="#44474D" font-size="12">•</text>
    <text x="439" y="512" fill="#666A72" font-size="12" font-weight="600" letter-spacing="1.7">IMPACT &gt; HYPE</text>
  </g>
  <g transform="translate(760 102)">
    <circle cx="188" cy="188" r="172" fill="#0E1013" stroke="#24272C"/>
    <circle cx="188" cy="188" r="132" fill="none" stroke="#2B2E34" stroke-width="1" opacity="0.9"/>
    <circle cx="188" cy="188" r="92" fill="none" stroke="#24272C" stroke-width="1" opacity="0.8"/>
    <path d="M38 188 A150 150 0 0 1 338 188" fill="none" stroke="url(#stroke)" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 188 188" to="360 188 188" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M78 188 A110 110 0 0 0 298 188" fill="none" stroke="#7EE7D8" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.33">
      <animateTransform attributeName="transform" type="rotate" from="360 188 188" to="0 188 188" dur="24s" repeatCount="indefinite"/>
    </path>
    <circle cx="188" cy="188" r="54" fill="#14161A" stroke="#30333A"/>
    <text x="188" y="202" text-anchor="middle" fill="#F5F2EA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="760" letter-spacing="-3">TY</text>
    <circle cx="188" cy="16" r="5" fill="#7EE7D8"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="188" r="4" fill="#A78BFA"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="188" cy="360" r="4" fill="#F5C67A"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <text x="188" y="398" text-anchor="middle" fill="#6F747C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">WEB / API / AUTHZ / LOGIC</text>
    <rect x="140" y="142" width="96" height="96" rx="28" fill="#7EE7D8" opacity="0.035" filter="url(#blur)"><animate attributeName="opacity" values="0.025;0.075;0.025" dur="5.8s" repeatCount="indefinite"/></rect>
  </g>
</svg>