<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Tayfur Yildiz — Security Researcher</title>
  <desc id="desc">Editorial portfolio hero with oversized typography.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#EFEAE1"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#40B8FF"/>
      <stop offset="1" stop-color="#72E4C1"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1200" height="540" rx="34" fill="url(#paper)"/>
  <circle cx="1050" cy="130" r="120" fill="#7C5CFF" opacity="0.10" filter="url(#blur)"/>
  <circle cx="980" cy="410" r="150" fill="#4FC8E8" opacity="0.10" filter="url(#blur)"/>

  <text x="58" y="60" fill="#111111" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="850" letter-spacing="-1">TY.</text>
  <text x="772" y="60" fill="#4A4A4A" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="650" letter-spacing="1.1">RESEARCH</text>
  <text x="878" y="60" fill="#4A4A4A" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="650" letter-spacing="1.1">WORK</text>
  <text x="956" y="60" fill="#4A4A4A" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="650" letter-spacing="1.1">CONTACT</text>
  <rect x="1043" y="28" width="112" height="44" rx="12" fill="#111111"/>
  <text x="1099" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="700">AVAILABLE</text>

  <text x="600" y="116" text-anchor="middle" fill="#55514A" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="500">Security research focused on practical web and API behavior.</text>

  <text x="62" y="260" fill="#101010" font-family="Inter,Arial,Helvetica,sans-serif" font-size="114" font-weight="900" letter-spacing="-7">SECURITY</text>
  <text x="62" y="372" fill="none" stroke="#101010" stroke-width="2.1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="108" font-weight="900" letter-spacing="-6">RESEARCHER</text>

  <circle cx="956" cy="288" r="44" fill="#111111"/>
  <text x="956" y="304" text-anchor="middle" fill="#F7F4EE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="42" font-weight="500">↗</text>
  <circle cx="1018" cy="278" r="18" fill="url(#orb)" opacity="0.95"/>

  <text x="62" y="444" fill="#111111" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="720">Tayfur Yildiz</text>
  <text x="62" y="472" fill="#68635C" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15">Bug bounty · web/API security · low-noise tooling</text>

  <text x="1138" y="444" text-anchor="end" fill="#111111" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="700">WEB / API / AUTH / ACCESS CONTROL</text>
  <line x1="854" y1="463" x2="1138" y2="463" stroke="#CFC7BB"/>
  <rect x="854" y="462" width="72" height="2" rx="1" fill="url(#orb)"/>
</svg>