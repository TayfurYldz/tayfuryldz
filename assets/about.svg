<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
  <title id="t">About Tayfur Yildiz</title><desc id="d">Portfolio-style about section.</desc>
  <rect width="1200" height="250" rx="28" fill="#0E0F11" stroke="#27292E"/>
  <text x="56" y="62" fill="#7EE7D8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="2.2">ABOUT / APPROACH</text>
  <text x="56" y="120" fill="#F5F2EA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="690" letter-spacing="-0.8">I care about proof, not theatre.</text>
  <text x="56" y="159" fill="#9B9FA7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">I reproduce, minimize and validate security issues until the evidence is clear.</text>
  <text x="56" y="185" fill="#9B9FA7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">My focus is web/API behavior, authorization, access control, HTTP edge cases and low-noise tooling.</text>
  <g transform="translate(805 54)">
    <text x="0" y="0" fill="#6F737B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="2">PROCESS</text>
    <text x="0" y="48" fill="#D9DADD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="620">01  Reproduce</text>
    <text x="0" y="82" fill="#D9DADD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="620">02  Minimize</text>
    <text x="0" y="116" fill="#D9DADD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="620">03  Validate</text>
    <text x="0" y="150" fill="#D9DADD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="620">04  Measure impact</text>
  </g>
  <line x1="760" y1="42" x2="760" y2="208" stroke="#2B2D32"/>
</svg>