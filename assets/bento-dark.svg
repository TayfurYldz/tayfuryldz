<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tayfur Yildiz — Portfolio Bento Grid</title>
  <desc id="desc">A compact bento-style GitHub profile featuring selected projects, security profiles, LinkedIn and contact information.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.12" cy="0.08" r="0.82">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.88" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="0.88" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.2px; fill: #7d8999; }
      .title { font-size: 39px; font-weight: 800; letter-spacing: -1.25px; fill: #f0f6fc; }
      .body { font-size: 15px; font-weight: 500; fill: #a9b4c0; }
      .meta { font-size: 12px; font-weight: 600; fill: #7d8999; }
      .link { font-size: 12px; font-weight: 750; letter-spacing: .7px; fill: #d8e0ea; }
      .index { font-size: 12px; font-weight: 700; fill: #596575; }
    </style>
  </defs>

  <!-- Hero -->
  <g>
    <rect x="20" y="20" width="1160" height="190" rx="24" fill="url(#hero)" stroke="#273244"/>
    <rect x="20" y="20" width="1160" height="190" rx="24" fill="url(#heroGlow)"/>
    <text x="52" y="56" class="mono eyebrow">PORTFOLIO / 2026</text>
    <g transform="translate(960 38)">
      <rect width="188" height="34" rx="17" fill="#151c25" stroke="#2d3948"/>
      <circle cx="19" cy="17" r="5" fill="#3fb950"/>
      <text x="34" y="21" class="mono" font-size="11" font-weight="700" fill="#a9b4c0">BUILDING + BREAKING</text>
    </g>
    <text x="52" y="128" class="sans" font-size="72" font-weight="850" letter-spacing="-3" fill="#f8fafc">TAYFUR YILDIZ</text>
    <text x="54" y="164" class="sans body">Frontend engineering × web security × bug bounty research.</text>
    <text x="1148" y="164" text-anchor="end" class="mono meta">TR / WEB</text>
  </g>

  <!-- Marrow -->
  <g>
    <rect x="20" y="226" width="572" height="220" rx="22" fill="#0f141b" stroke="#273244"/>
    <rect x="20" y="226" width="572" height="220" rx="22" fill="url(#blueGlow)"/>
    <text x="48" y="260" class="mono index">01</text>
    <text x="564" y="260" text-anchor="end" class="mono eyebrow">SELECTED WORK</text>
    <text x="48" y="316" class="sans title">MARROW</text>
    <text x="48" y="348" class="sans body">Evidence-first HTTP request minimization.</text>
    <text x="48" y="376" class="mono meta">Python  ·  reduction  ·  fail-closed</text>
    <line x1="48" y1="397" x2="564" y2="397" stroke="#273244"/>
    <text x="48" y="424" class="mono link">OPEN REPOSITORY ↗</text>
    <text x="564" y="424" text-anchor="end" class="mono meta">github.com/TayfurYldz/marrow</text>
  </g>

  <!-- HeaderProof -->
  <g>
    <rect x="608" y="226" width="572" height="220" rx="22" fill="#0f141b" stroke="#273244"/>
    <rect x="608" y="226" width="572" height="220" rx="22" fill="url(#orangeGlow)"/>
    <text x="636" y="260" class="mono index">02</text>
    <text x="1152" y="260" text-anchor="end" class="mono eyebrow">SELECTED WORK</text>
    <text x="636" y="316" class="sans title">HeaderProof</text>
    <text x="636" y="348" class="sans body">Fast, low-noise active security scanner.</text>
    <text x="636" y="376" class="mono meta">CORS  ·  CSRF  ·  cache  ·  headers</text>
    <line x1="636" y1="397" x2="1152" y2="397" stroke="#273244"/>
    <text x="636" y="424" class="mono link">OPEN REPOSITORY ↗</text>
    <text x="1152" y="424" text-anchor="end" class="mono meta">github.com/TayfurYldz/headerproof</text>
  </g>

  <!-- HackerOne -->
  <g>
    <rect x="20" y="462" width="374" height="278" rx="22" fill="#0f141b" stroke="#273244"/>
    <text x="48" y="496" class="mono eyebrow">SECURITY PROFILE</text>
    <text x="48" y="542" class="sans" font-size="31" font-weight="800" letter-spacing="-1" fill="#f0f6fc">HackerOne</text>
    <text x="48" y="570" class="sans body">reports · impact · signal</text>
    <g transform="translate(48 594)">
      <rect width="104" height="104" rx="24" fill="#f0f6fc"/>
      <text x="52" y="72" text-anchor="middle" class="sans" font-size="52" font-weight="900" letter-spacing="-4" fill="#0d1117">H1</text>
    </g>
    <text x="48" y="720" class="mono link">OPEN PROFILE ↗</text>
  </g>

  <!-- Bugcrowd -->
  <g>
    <rect x="410" y="462" width="374" height="278" rx="22" fill="#0f141b" stroke="#273244"/>
    <rect x="410" y="462" width="374" height="278" rx="22" fill="url(#orangeGlow)"/>
    <text x="438" y="496" class="mono eyebrow">SECURITY PROFILE</text>
    <text x="438" y="542" class="sans" font-size="31" font-weight="800" letter-spacing="-1" fill="#f0f6fc">Bugcrowd</text>
    <text x="438" y="570" class="sans body">bug bounty · research · reputation</text>
    <g transform="translate(438 602)">
      <path d="M40 0h48l24 42-24 42H40L16 42z" fill="#f97316"/>
      <text x="64" y="56" text-anchor="middle" class="sans" font-size="38" font-weight="900" fill="#ffffff">b</text>
    </g>
    <text x="438" y="720" class="mono link">OPEN PROFILE ↗</text>
  </g>

  <!-- LinkedIn -->
  <g>
    <rect x="800" y="462" width="380" height="131" rx="22" fill="#0f141b" stroke="#273244"/>
    <text x="828" y="496" class="mono eyebrow">NETWORK</text>
    <text x="828" y="538" class="sans" font-size="31" font-weight="800" letter-spacing="-1" fill="#f0f6fc">LinkedIn</text>
    <text x="828" y="565" class="mono link">OPEN PROFILE ↗</text>
    <g transform="translate(1090 485)">
      <rect width="62" height="62" rx="14" fill="#0a66c2"/>
      <text x="31" y="45" text-anchor="middle" class="sans" font-size="37" font-weight="850" fill="#ffffff">in</text>
    </g>
  </g>

  <!-- Contact -->
  <g>
    <rect x="800" y="609" width="380" height="131" rx="22" fill="#0f141b" stroke="#273244"/>
    <text x="828" y="643" class="mono eyebrow">CONTACT</text>
    <text x="828" y="682" class="sans" font-size="27" font-weight="800" letter-spacing="-1" fill="#f0f6fc">Reach out.</text>
    <text x="828" y="710" class="mono meta">ariacreative.net.tr</text>
    <text x="1152" y="710" text-anchor="end" class="sans" font-size="30" font-weight="400" fill="#596575">↗</text>
  </g>
</svg>
