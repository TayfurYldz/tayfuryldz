<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Tayfur Yildiz — Security Research Dashboard</title>
  <desc id="desc">Animated minimal dashboard banner for GitHub light mode.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d5dee6" stroke-width="1" opacity="0.75"/>
    </pattern>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="26" fill="#f6f8fa"/>
  <rect x="28" y="26" width="1144" height="408" rx="24" fill="url(#bg)" stroke="#d0d7de"/>
  <rect x="44" y="44" width="1112" height="372" rx="20" fill="url(#grid)" opacity="0.82"/>
  <rect x="56" y="56" width="1088" height="348" rx="18" fill="#ffffff" stroke="#d8dee4"/>

  <circle cx="84" cy="84" r="6" fill="#cf222e"/>
  <circle cx="105" cy="84" r="6" fill="#9a6700"/>
  <circle cx="126" cy="84" r="6" fill="#1a7f37"/>
  <text x="160" y="90" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">tayfuryldz / security-dashboard</text>

  <rect x="80" y="116" width="990" height="1" fill="#d5dee6" opacity="1"/>
  <text x="92" y="154" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">&gt; init researcher --mode evidence-first --surface web/api</text>
  <rect x="616" y="140" width="9" height="18" fill="#1a7f37"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/></rect>

  <text x="92" y="206" fill="#24292f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="36" font-weight="600">Tayfur Yildiz</text>
  <text x="92" y="236" fill="#3d4650" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="20">Security Researcher · Bug Bounty · Web &amp; API Security</text>
  <text x="92" y="274" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">authn/authz · access control · business logic · low-noise tooling</text>

  <text x="92" y="324" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">github    → github.com/TayfurYldz</text>
  <text x="92" y="351" fill="#8250df" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">linkedin  → linkedin.com/in/tayfur-yıldız-3b7820391</text>
  <text x="92" y="378" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">bugcrowd  → bugcrowd.com/h/tayfuryldz</text>

  <g transform="translate(860 136)">
    <rect x="0" y="0" width="214" height="210" rx="18" fill="#ffffff" stroke="#d8dee4"/>
    <text x="22" y="34" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">[ live focus ]</text>
    <text x="22" y="72" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">HTTP</text>
    <rect x="84" y="60" width="78" height="13" rx="2" fill="#e9eef2"/>
    <rect x="84" y="60" width="61" height="13" rx="2" fill="#8d96a0"/>
    <text x="22" y="103" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">AUTH</text>
    <rect x="84" y="91" width="78" height="13" rx="2" fill="#e9eef2"/>
    <rect x="84" y="91" width="67" height="13" rx="2" fill="#8d96a0"/>
    <text x="22" y="134" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">API</text>
    <rect x="84" y="122" width="78" height="13" rx="2" fill="#e9eef2"/>
    <rect x="84" y="122" width="54" height="13" rx="2" fill="#8d96a0"/>
    <text x="22" y="165" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">TOOLING</text>
    <rect x="84" y="153" width="78" height="13" rx="2" fill="#e9eef2"/>
    <rect x="84" y="153" width="72" height="13" rx="2" fill="#8d96a0"/>
    <text x="22" y="189" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">researching / building / validating</text>
    <rect x="22" y="197" width="142" height="2" fill="#2da44e" opacity="0.22"/>
    <rect x="22" y="197" width="48" height="2" fill="#1a7f37" filter="url(#glow)"><animate attributeName="x" values="22;115;22" dur="2.8s" repeatCount="indefinite"/></rect>
  </g>

  <text x="92" y="402" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">evidence-first · reproducible · measurable impact</text>
  <rect x="56" y="56" width="1088" height="2" fill="#2da44e" opacity="0.55"><animate attributeName="opacity" values="0.2;0.55;0.2" dur="3.2s" repeatCount="indefinite"/></rect>
</svg>
