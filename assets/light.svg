<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Tayfur Yildiz — Security Research</title>
  <desc id="desc">A restrained technical profile dashboard with subtle ambient animation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="0.56" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#101823"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.18" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#9CCFD8" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#9CCFD8" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#9CCFD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#AAB4C3" stroke-width="1" opacity="0.045"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#9CCFD8"/>
      <stop offset="0.55" stop-color="#C4A7E7"/>
      <stop offset="1" stop-color="#F6C177"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="28" fill="url(#wash)"/>
  <rect x="1" y="1" width="1198" height="428" rx="27" fill="none" stroke="#263445"/>
  <rect x="18" y="18" width="1164" height="394" rx="22" fill="url(#grid)"/>
  <rect x="34" y="34" width="1132" height="2" rx="1" fill="#1B2734"/>
