<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d">
  <title id="t">About Tayfur Yildiz</title>
  <desc id="d">Short about section.</desc>
  <text x="36" y="44" fill="#57606A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="3">ABOUT</text>
  <text x="36" y="102" fill="#17191C" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="32" font-weight="900" letter-spacing="-1.2">I build for the web — and study where it starts to bend.</text>
  <text x="36" y="154" fill="#424A53" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">My background is frontend development, which naturally pulled me toward web and API security,</text>
  <text x="36" y="184" fill="#424A53" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">access-control issues, and practical bug bounty work.</text>
  <text x="36" y="230" fill="#6E7781" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">I’m still growing on the research side, so I prefer careful reproduction and clear evidence over big claims.</text>
</svg>