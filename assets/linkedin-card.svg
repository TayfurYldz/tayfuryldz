<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" role="img" aria-labelledby="t d">
  <title id="t">LinkedIn profile card</title>
  <desc id="d">Minimal clickable card for LinkedIn profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b121a"/>
      <stop offset="1" stop-color="#101926"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="360" height="180" rx="18" fill="url(#bg)" stroke="#273547"/>
  <rect x="18" y="18" width="324" height="144" rx="14" fill="#0d1724" stroke="#223247"/>
  <rect x="18" y="18" width="324" height="2" fill="#0a66c2" opacity="0.45"><animate attributeName="opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/></rect>
  <text x="28" y="56" fill="#e6edf3" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">LinkedIn</text>
  <rect x="252" y="34" width="72" height="30" rx="8" fill="#0a66c2"/>
  <text x="288" y="54" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">PROFILE</text>
  <text x="28" y="92" fill="#9eabb8" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif" font-size="14">professional identity</text>
  <text x="28" y="115" fill="#7f8b97" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif" font-size="13">experience · network · updates</text>
  <text x="28" y="140" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">OPEN PROFILE →</text>
  <rect x="28" y="148" width="188" height="2" fill="#0a66c2" opacity="0.24"/>
  <rect x="28" y="148" width="44" height="2" fill="#58a6ff" filter="url(#glow)"><animate attributeName="x" values="28;170;28" dur="2.8s" repeatCount="indefinite"/></rect>
  <circle cx="308" cy="140" r="4.5" fill="#0a66c2"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>
