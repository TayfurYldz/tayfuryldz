<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="t d">
  <title id="t">LinkedIn — Tayfur Yildiz</title>
  <desc id="d">Animated LinkedIn profile card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1320"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#0a66c2"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="318" height="318" rx="24" fill="url(#bg)" stroke="#30363d"/>
  <rect x="18" y="18" width="284" height="284" rx="18" fill="#0a0f16" stroke="#21262d"/>

  <rect x="28" y="28" width="52" height="52" rx="11" fill="#0a66c2"/>
  <text x="54" y="66" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">in</text>
  <text x="94" y="51" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">LinkedIn</text>
  <text x="94" y="72" fill="#7d8590" font-family="Arial, Helvetica, sans-serif" font-size="12">professional profile</text>

  <line x1="28" y1="98" x2="292" y2="98" stroke="#21262d"/>

  <text x="28" y="132" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Tayfur Yildiz</text>
  <text x="28" y="158" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="13">Security Researcher</text>
  <text x="28" y="181" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="13">Bug Bounty · Web &amp; API Security</text>

  <rect x="28" y="210" width="264" height="50" rx="12" fill="#0d1622" stroke="#1f2a37"/>
  <text x="44" y="231" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">linkedin.com/in/</text>
  <text x="44" y="248" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">tayfur-yıldız-3b7820391</text>

  <text x="28" y="284" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">OPEN PROFILE  →</text>
  <circle cx="286" cy="280" r="4" fill="#2f81f7">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <rect x="18" y="18" width="284" height="2" rx="1" fill="#0a66c2" opacity="0.18"/>
  <rect x="18" y="18" width="74" height="2" rx="1" fill="url(#blue)" filter="url(#glow)">
    <animate attributeName="x" values="18;228;18" dur="3.4s" repeatCount="indefinite"/>
  </rect>
</svg>
